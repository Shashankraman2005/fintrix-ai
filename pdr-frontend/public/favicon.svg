<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fintrix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338CA" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background panel -->
  <rect width="512" height="512" rx="128" fill="#0B0E14" />
  <rect width="512" height="512" rx="128" fill="url(#glow-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#fintrix-grad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Stylized F + Spark motif -->
  <g filter="url(#shadow)">
    <!-- Vertical stem -->
    <path d="M 136 128 L 196 128 L 196 384 L 136 384 Z" fill="url(#fintrix-grad)" />
    <!-- Top arm -->
    <path d="M 196 128 L 376 128 Q 392 128 392 144 L 392 176 Q 392 192 376 192 L 196 192 Z" fill="url(#fintrix-grad)" />
    <!-- Middle arm with upward trend arrow notch -->
    <path d="M 196 240 L 328 240 Q 344 240 344 256 L 344 288 Q 344 304 328 304 L 196 304 Z" fill="url(#fintrix-grad)" />
    <!-- Cyan spark vector indicator -->
    <circle cx="392" cy="160" r="16" fill="#06B6D4" />
    <path d="M 328 272 L 408 192 L 392 248 L 416 184 L 360 200 Z" fill="#06B6D4" />
  </g>
</svg>