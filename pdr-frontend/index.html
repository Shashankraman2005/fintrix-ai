<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FintrixAi | Trust Intelligence</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind Config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#4338CA",
                  "primary-dim": "#3730A3",
                  "primary-container": "#EEF2FF",
                  "tertiary": "#7C3AED",
                  "tertiary-dim": "#6D28D9",
                  "tertiary-container": "#F5F3FF",
                  "accent-cyan": "#06B6D4",
                  "surface": "#F7F8FA",
                  "surface-dim": "#E5E7EB",
                  "surface-container": "#F3F4F6",
                  "surface-container-low": "#F9FAFB",
                  "surface-container-lowest": "#FFFFFF",
                  "surface-container-high": "#E5E7EB",
                  "on-surface": "#0F172A",
                  "on-surface-variant": "#475569",
                  "on-primary": "#FFFFFF",
                  "on-tertiary": "#FFFFFF",
                  "on-primary-container": "#312E81",
                  "on-tertiary-container": "#4C1D95",
                  "error": "#F43F5E",
                  "error-dim": "#9F1239",
                  "error-container": "#FFE4E6",
                  "on-error": "#FFFFFF",
                  "on-error-container": "#881337",
                  "success": "#10B981",
                  "success-container": "#D1FAE5",
                  "on-success": "#FFFFFF",
                  "outline": "#94A3B8",
                  "outline-variant": "#CBD5E1",
                  "secondary": "#64748B",
                  "secondary-container": "#F1F5F9",
                },
                fontFamily: {
                  "headline": ["Manrope", "sans-serif"],
                  "body": ["Inter", "sans-serif"],
                  "label": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
              },
            },
          }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-headline { font-family: 'Manrope', sans-serif; letter-spacing: -0.02em; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
      .gradient-primary { background: linear-gradient(135deg, #4338CA 0%, #7C3AED 100%); }
      .gradient-cta { background: linear-gradient(135deg, #4338CA 0%, #7C3AED 50%, #06B6D4 100%); }
      .gradient-dark { background: linear-gradient(135deg, #0B0E14 0%, #12151C 100%); }
      .gradient-text { background: linear-gradient(135deg, #4338CA 0%, #7C3AED 50%, #06B6D4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .ghost-border { border: 1px solid rgba(148, 163, 184, 0.2); }

      /* Animation keyframes */
      @keyframes slideUpFade {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
      }
      .animate-reveal {
          animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .progress-bar-fill {
          transition: width 0.1s linear;
      }

      .pulse-container {
          animation: pulse-soft 2s infinite ease-in-out;
      }

      @keyframes pulse-soft {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.85; transform: scale(0.98); }
      }
      
      .glass-panel {
          background: rgba(255, 255, 255, 0.75);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(226, 232, 240, 0.7);
      }
      .dark .glass-panel {
          background: rgba(18, 21, 28, 0.75);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .risk-waterfall-red { background: repeating-linear-gradient(45deg, #f43f5e, #f43f5e 5px, #fff1f2 5px, #fff1f2 10px); }
    </style>
  </head>
  <body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
